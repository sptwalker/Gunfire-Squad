<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { TIER_CLASSES, TIERS } from './gamedata.js';
import { ZOMBIES as SRC_Z } from '../../src/data/zombies.ts';
import { ELITES, MUTANTS } from '../../src/data/enemies.ts';
import { ORDER_Z } from './gamedata.js';
import { CLASSES } from '../../src/data/classes.ts';

// 握持方式 → 攻击 / 跑动动画（05 §2.3）。换武器 = 换挂点模型 + 换这一组，其余动作不动
const GRIPS = {
  melee: { attack: 'attack_melee1h', run: 'run_melee1h' },
  heavy: { attack: 'attack_heavy',   run: 'run_melee1h' },
  thrust: { attack: 'attack_thrust', run: 'run_melee1h' },
  rifle: { attack: 'attack_rifle',   run: 'run_rifle' },
  onehand: { attack: 'attack_pistol', run: 'run' },
  throw: { attack: 'attack_throw',   run: 'run' },
};
const WEAPONS = {
  sword: ['剑', 'melee'], greatsword: ['大剑', 'heavy'], spear: ['长枪', 'thrust'],
  sniper: ['狙击枪', 'rifle'], flamer: ['喷火器', 'rifle'], freezer: ['冷冻枪', 'rifle'], laser: ['激光枪', 'rifle'],
  pistol: ['手枪', 'onehand'], smg: ['冲锋枪', 'onehand'], grenade: ['手雷', 'throw'], boomerang: ['回旋镖', 'throw'],
};
for (const [id, [name, g]] of Object.entries(WEAPONS)) WEAPONS[id] = { name, file: `assets/vox_${id}.glb`, ...GRIPS[g] };
// 12 名角色与各自的主武器（src/data/characters.ts）
const HEROES = [
  ['ron', '罗恩', 'greatsword'], ['gwen', '格温', 'spear'], ['kai', '凯', 'sword'], ['ironbull', '铁牛', 'greatsword'],
  ['vera', '薇拉', 'sniper'], ['jet', '杰特', 'smg'], ['ella', '艾拉', 'freezer'], ['bom', '博姆', 'grenade'],
  ['lian', '莉安', 'pistol'], ['shaman', '萨满', 'flamer'], ['nox', '诺克斯', 'boomerang'], ['sif', '西芙', 'laser'],
];
// 剑士 / 射手 / 法师 / 辅助 / 技术树各 191 个职业形象（tools/voxel.py LOOKS → assets/looks.json：wr / wl = 右 / 左手武器，hips = 臀高 m）
const LMETA = await (await fetch('assets/looks.json')).json();
const LTREE = { looks: 'swordsman', looks_ar: 'archer', looks_mg: 'mage', looks_md: 'medic', looks_te: 'tech' }, isLooks = (t) => t in LTREE;   // 页签 → 树
const LOOKS = CLASSES.filter((c) => Object.values(LTREE).includes(c.tree));
const STATES = { idle: 'Q', run: 'W', attack: 'E', hit: 'R', death: 'T' };
const LSTATES = { idle: 'F', run: 'G', attack: 'H', hit: 'J', death: 'K',   // 形象页：QWE 给镜头；末尾 7 个按钮对应后补的 8 条 clip，见 proto/m0/anim-gaps.md
  leap: 'Y', spin: 'U', summon: 'I', cast: 'O', guard: 'P', aim: 'L', roll: ';' };   // aim 按钮按握法分流 aim / aim_pistol
const N = HEROES.length, COLS = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f1d);
scene.add(new THREE.HemisphereLight(0xdfe8e0, 0x30382f, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(140, 140), new THREE.MeshLambertMaterial({ color: 0x3a4238 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(new THREE.GridHelper(140, 140, 0x4c564a, 0x444c42));

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 400);
const VIEWS = { front: [[0, 2.2, 10], [0, 0.6, -0.8]], top: [[0, 13, 6], [0, 0, -0.8]],
  bfront: [[0, 3.6, 15], [0, 1.5, -0.8]], btop: [[0, 18, 9], [0, 0, -0.8]],
  zfront: [[0, 19, 25], [0, 0, 1.5]], ztop: [[0, 40, 5], [0, 0, 0]],
  cfront: [[0, 42, 92], [0, 0, 4]], ctop: [[0, 150, 1], [0, 0, 0]],
  lfront: [[0, 21, 46], [0, 0, 4]], ltop: [[0, 66, 6], [0, 0, 0]] };
let view = 'front';
// 右键拖动环绕、滚轮缩放、中键平移；左键留给以后点选
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
// BOSS 是 2-2.6 倍大、僵尸方阵与职业圆盘更大，各用一组拉远的机位
function setView(v) { view = v; const b = { bosses: 'b', zombies: 'z', classes: 'c', looks: 'l', looks_ar: 'l', looks_mg: 'l', looks_md: 'l', looks_te: 'l' }[tab] ?? ''; camera.position.set(...VIEWS[b + v][0]); orbit.target.set(...VIEWS[b + v][1]); orbit.update(); }
let tab = 'classes';
setView('front');

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load = (f) => new Promise((ok, err) => loader.load(f, ok, undefined, err));
const wIds = Object.keys(WEAPONS);
// 敌对目标（zombies.html 同一张表）：僵尸 / 精英 / 变异生物，file = assets/vox_<file>.glb；skill = 专属动作；分裂小复用分裂的模型缩到 0.4
const ZSKILL = { bomber: 'swell', splitter: 'split', leaper: 'leap', ward: 'block', spitter: 'spit', herald: 'roar', summoner: 'summon', flyer: 'leap', screamer: 'roar',
  dog: 'leap', wolf: 'roar', bear: 'smash', vulture: 'eat', ape: 'leap' };
const zent = (group, z, file, ai) => ({ group, id: z.id, name: z.name, skill: ZSKILL[ai], file, scale: z.id === 'spawnling' ? 0.4 : 1 });
const ZOMBIES = [
  ...ORDER_Z.map((id) => zent('z', SRC_Z[id], id === 'spawnling' ? 'z_splitter' : 'z_' + id, id)),
  ...Object.values(ELITES).map((e) => zent('e', e, 'e_' + e.base, e.base)),
  ...Object.values(MUTANTS).map((m) => zent('m', m, 'm_' + m.id, m.id)),
];
const zFiles = [...new Set(ZOMBIES.map((z) => z.file))];
// BOSS（src/data/run.ts BOSSES）：skill = 专属动作，第二个是「专属 2」
const BOSSES = [
  ['corrupted', '腐化重装兵', []], ['vesse', '毒母·薇丝', ['summon', 'spit']], ['chaos', '尸潮之主·卡俄斯', ['smash', 'roar']],
].map(([id, name, skills]) => ({ id, name, skill: skills[0], skill2: skills[1], file: id, scale: 1 }));
// 场景物件（05 §4 / §5.2；src/data/scenes.ts 的 6 张图）：每张图的代表物件 + 通用件
const PNAME = { ruin: '残楼', shop: '临街铺面', car: '废弃轿车', fence: '铁栅栏', partition: '走廊隔断', barrel: '油桶', crate: '补给箱',
  ammo: '弹药箱', rubble: '碎石堆', tree: '阔叶树', palm: '棕榈', grass: '草丛', hay: '草垛', deadtree: '枯树', stump: '空心树桩',
  rock_moss: '苔石', cactus: '柱仙人掌', cactus_ball: '球仙人掌', mesa: '砂岩台地', pine: '雪松', snowpile: '雪堆', rock_ice: '冻岩',
  bunker: '碉堡', sandbag: '沙袋墙', wire: '铁丝网', woodwall: '木墙',
  buff_shield: '护盾', buff_speed: '加速', buff_damage: '增伤', buff_heal: '治疗', buff_cooldown: '冷却' };
const PSCENES = {
  city: ['城市废墟', 0x5a5a56, ['ruin', 'shop', 'car', 'partition', 'fence', 'barrel', 'rubble']],
  jungle: ['原始丛林', 0x3c5a2e, ['tree', 'palm', 'grass', 'hay']],
  swamp: ['沼泽疫地', 0x3e4636, ['deadtree', 'stump', 'rock_moss']],
  desert: ['荒漠废土', 0xb89a6a, ['mesa', 'cactus', 'cactus_ball', 'hay', 'barrel']],
  snow: ['雪原冻土', 0xc8d4dc, ['pine', 'snowpile', 'rock_ice', 'crate']],
  military: ['军事禁区', 0x5a5e4a, ['bunker', 'sandbag', 'wire', 'woodwall', 'crate', 'ammo', 'barrel']],
  shared: ['通用 · 增益', 0x3a4238, ['buff_shield', 'buff_speed', 'buff_damage', 'buff_heal', 'buff_cooldown', 'crate', 'barrel', 'rubble']],
};
const pIds = Object.keys(PNAME);
const LW = [...new Set(LOOKS.flatMap((c) => [LMETA[c.id].wr, LMETA[c.id].wl]).filter(Boolean))];
const [chars, wpns, zgl, bgl, pgl, lgl, lwgl] = await Promise.all([
  Promise.all(HEROES.map(([id]) => load(`assets/vox_${id}.glb`))),
  Promise.all(wIds.map((id) => load(WEAPONS[id].file))),
  Promise.all(zFiles.map((f) => load(`assets/vox_${f}.glb`))),
  Promise.all(BOSSES.map((b) => load(`assets/vox_b_${b.file}.glb`))),
  Promise.all(pIds.map((id) => load(`assets/prop_${id}.glb`))),
  Promise.all(LOOKS.map(({ id }) => load(`assets/vox_${id.replace('+', '_star')}.glb`))),
  Promise.all(LW.map((id) => load(`assets/vox_${id}.glb`))),
]);
wIds.forEach((id, i) => (WEAPONS[id].scene = wpns[i].scene));

// 地面名牌：全部画进一张图集、合成一个网格（955 块职业名牌 = 1 个 draw call）
// 牌子本地 x 沿 it.rot 方向长 w、本地 z 宽 h，图集格子的上沿对着本地 -z；tx / ty = 文字中心占格子的比例
function plates(items, cw, ch, w, h, ty, font) {
  const per = Math.floor(4096 / cw), W = per * cw, H = Math.ceil(items.length / per) * ch;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d'); g.textAlign = 'center'; g.textBaseline = 'middle';
  const pos = [], uv = [], idx = [];
  items.forEach((it, i) => {
    const cx = (i % per) * cw, cy = Math.floor(i / per) * ch, x = cx + it.tx * cw, mw = 2 * Math.min(it.tx, 1 - it.tx) * cw - 16;
    g.fillStyle = it.fill; g.beginPath(); g.roundRect(cx + 2, cy + 2, cw - 4, ch - 4, 10); g.fill();
    g.fillStyle = '#1b1f1d'; g.font = `600 ${font}px "Microsoft YaHei", "PingFang SC", sans-serif`;
    g.fillText(it.text, x, cy + ch * (it.sub ? ty - 0.1 : ty), mw);   // 超宽就横向压扁（五星名最长 8 字）
    if (it.sub) { g.font = `${font * 0.6}px sans-serif`; g.fillText(it.sub, x, cy + ch * (ty + 0.14), mw); }
    const c = Math.cos(it.rot), s = Math.sin(it.rot), b = pos.length / 3;
    for (const [lx, lz] of [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]) pos.push(it.x + lx * c - lz * s, 0.012, it.z + lx * s + lz * c);
    const u0 = cx / W, u1 = (cx + cw) / W, v0 = 1 - cy / H, v1 = 1 - (cy + ch) / H;
    uv.push(u0, v0, u1, v0, u1, v1, u0, v1);
    idx.push(b, b + 2, b + 1, b, b + 3, b + 2);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); geo.setIndex(idx);
  const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: tex, alphaTest: 0.5 })); m.visible = false; scene.add(m);
  return m;
}

// ── 职业圆盘：全部职业按转数一圈圈往外排（内基础 → 1–6 转 → 外五星），每圈五大类各占 1/5 扇区，扇区跨圈对齐 ──
// 站的是各职业自己的形象模型（形象页的 lunits，切到本页时挪到圈上）；名牌带编号「S 3.5」= 树字母 + 形象页的 转.序号
// 名牌沿半径朝外写、人站在牌子内端；左半圈整块转 180° 免得字倒着
const TREE_COL = { swordsman: '#d4a017', archer: '#7fd0ff', mage: '#b89cf0', medic: '#8fe39a', tech: '#aab6c4' };
const RING_R = [5, 10, 15.5, 21.5, 28, 36, 45, 55];
const CLS = RING_R.flatMap((R, k) => {
  const l = TIER_CLASSES(k);
  return l.map((c, i) => {
    const a = (i + 0.5) / l.length * 2 * Math.PI - Math.PI / 2, flip = Math.cos(a) < -1e-6;
    return { ...c, tier: k, pos: new THREE.Vector3(R * Math.cos(a), 0, R * Math.sin(a)), rotY: Math.atan2(Math.cos(a), Math.sin(a)), phase: Math.random() * 9,
      plate: { text: c.full, fill: TREE_COL[c.tree], x: (R + 1.35) * Math.cos(a), z: (R + 1.35) * Math.sin(a), rot: flip ? a + Math.PI : a, tx: flip ? 0.375 : 0.625 } };
  });
});
console.assert(CLS.length === 955 && CLS.every((c) => TREE_COL[c.tree]), 'classes', CLS.length);
const TREE_CODE = { swordsman: 'S', mage: 'M', archer: 'A', medic: 'H', tech: 'T' };
const RING_NAME = (k) => (k === 0 ? '基础' : k === 7 ? '五星' : `${k} 转`);
legend.innerHTML = Object.entries(TREE_COL).map(([t, col]) => `<span><i class="sw" style="background:${col}"></i>${CLS.find((c) => c.tree === t).treeName}</span>`).join('')
  + `<span style="color:var(--dim)">内 → 外：${RING_NAME(0)} … ${RING_NAME(7)}（${RING_R.map((_, k) => CLS.filter((c) => c.tier === k).length).join(' / ')}）</span>`;
// Blender 导出的动作名带 "_Armature" 后缀，按前缀认
const clipOf = (anims, name) => anims.find((a) => a.name === name || a.name.startsWith(name + '_'));
// 持械跑：腿用 run，匹配 bones 的骨骼钉在持握姿态的第一帧
// 端枪 = 胸以上钉在抵肩瞄准；持刀 = 只钉右臂（刀尖朝前上），左臂照常摆
function overlay(anims, name, pose, bones) {
  const run = clipOf(anims, 'run'), hold = clipOf(anims, pose);
  const on = (t) => bones.test(t.name.split('.')[0]);
  const pinned = hold.tracks.filter(on).map((t) => {
    const n = t.getValueSize();
    return new t.constructor(t.name, [0], Array.from(t.values.slice(0, n)));
  });
  anims.push(new THREE.AnimationClip(name, run.duration, [...run.tracks.filter((t) => !on(t)), ...pinned]));
}

// 两排六人；每人一份自己的骨架和动作（体形不同，关节位置 12 人共用）
const units = HEROES.map(([id, name, weaponId], i) => {
  const g = chars[i];
  overlay(g.animations, 'run_rifle', 'attack_rifle', /mixamorig(Spine1|Spine2|Neck|Head|Left|Right)(?!.*(UpLeg|Leg|Foot|Toe))/);
  overlay(g.animations, 'run_melee1h', 'hold_melee1h', /mixamorigRight(Arm|ForeArm|Hand$)/);
  const root = g.scene;
  root.position.set((i % COLS - (COLS - 1) / 2) * 1.4, 0, -Math.floor(i / COLS) * 1.8);
  scene.add(root);
  const socket = root.getObjectByName('socket_hand_r');
  const mixer = new THREE.AnimationMixer(root);
  const u = { id, name, root, socket, mixer, anims: g.animations, home: weaponId, weapon: null, weaponId: null, state: null, action: null };
  mixer.addEventListener('finished', (e) => { if (e.action.getClip().name === 'hit') play(u, 'idle'); });
  return u;
});

// 唯一的挂点变换：武器 +Z（枪口）→ 骨骼 +Y，武器 +Y → 骨骼 -Z。所有武器共用，不逐把调
const GRIP = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
function equip(u, id) {
  if (u.weapon) u.socket.remove(u.weapon);
  u.weapon = WEAPONS[id].scene.clone();
  u.weapon.quaternion.copy(GRIP);
  // 骨架导出时带了缩放，抵掉它让武器保持米制尺寸——这是整条骨架的常量，不是逐把偏移
  u.root.updateMatrixWorld(true);
  const s = new THREE.Vector3(); u.socket.getWorldScale(s);
  u.weapon.scale.setScalar(1 / s.x);
  u.socket.add(u.weapon);
  u.weaponId = id;
  if (u.state === 'attack' || u.state === 'run') play(u, u.state, true);
}

const MISSING = new Set();   // 缺 clip 只报一次，别刷屏
function play(u, state, force) {
  if (u.state === state && !force) return;
  const name = state === 'attack' || state === 'run' ? WEAPONS[u.weaponId][state] : state;
  const clip = clipOf(u.anims, name);
  // clipOf 找不到时返回 undefined，clipAction(undefined) 会从 three.js 内部抛出来（看不出是哪个动作缺）
  if (!clip) { if (!MISSING.has(name)) { MISSING.add(name); console.warn(`缺 clip「${name}」：${u.id} 的动作集只有 ${u.anims.map((a) => a.name).join(', ')}`); } return; }
  const a = u.mixer.clipAction(clip);
  const once = state === 'hit' || state === 'death';
  a.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = state === 'death';
  if (u.action && u.action !== a) a.crossFadeFrom(u.action, 0.15, false);
  a.play();
  u.action = a; u.state = state;
}

// ── 僵尸阵列：一排 10 只，材质名 _glow 不受光、_glass 半透明（同 zombies.html）──
const ZSRC = Object.fromEntries(zFiles.map((f, i) => [f, zgl[i]]));

    stat.textContent = `${isLooks(tab) ? lunits.filter((u) => u.tree === LTREE[tab]).length : tab === 'classes' ? CLS.length : tab === 'heroes' ? N : tab === 'props' ? pgroups[pscene].items.length : monsters().length} 实例 · ${stats.tris} 三角面 · ${fps.toFixed(0)} FPS · GPU ${stats.gpuMs == null ? '不可测' : stats.gpuMs.toFixed(2) + ' ms'}`;
  }
});
