<!-- M0 验证台：角色 + 运行时换武器；「僵尸」页签看 9 种僵尸 + 分裂小；「BOSS」页签看 3 个关底 BOSS；「场景物件」页签按地图分组看障碍 / 植被 / 增益。从仓库根目录起服务：python -m http.server，打开 /proto/m0/ -->
<meta charset="utf-8">
<title>M0 绑骨验证台</title>
<style>
  :root { --bg: #1b1f1d; --fg: #d9e0dc; --dim: #8a968f; --acc: #9fbf6a; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.5 ui-monospace, Consolas, monospace; }
  canvas { display: block; }
  #hud { position: fixed; left: 16px; top: calc(12px + env(safe-area-inset-top, 0px)); display: grid; gap: 6px; max-width: calc(100% - 32px); }
  #hud .row { display: flex; flex-wrap: wrap; gap: 6px; }
  button { font: inherit; color: var(--fg); background: #2a302d; border: 1px solid #3b443f; border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--acc); color: var(--acc); }
  button:focus-visible { outline: 2px solid var(--acc); }
  kbd { color: var(--dim); }
  #stat { color: var(--dim); font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }
  .tag { position: fixed; transform: translate(-50%, 0); font-size: 12px; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: nowrap; }
</style>
<div id="hud">
  <div class="row" id="tabs" role="tablist"></div>
  <div class="row" id="weapons"></div>
  <div class="row" id="states"></div>
  <div class="row" id="zstates" hidden></div>
  <div class="row" id="pscenes" hidden></div>
  <div class="row"><button id="cam">俯视 / 正视 <kbd>C</kbd></button><span id="hint" style="color:var(--dim)">右键拖动旋转 · 滚轮缩放 · 中键平移</span></div>
  <div id="stat">加载中…</div>
</div>
<div id="tags" hidden></div>
<script type="importmap">
{ "imports": {
  "three": "../../node_modules/three/build/three.module.js",
  "three/addons/": "../../node_modules/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 握持方式 → 攻击 / 跑动动画（05 §2.3）。换武器 = 换挂点模型 + 换这一组，其余动作不动
const GRIPS = {
  melee: { attack: 'attack_melee1h', run: 'run_melee1h' },
  heavy: { attack: 'attack_heavy',   run: 'run_melee1h' },
  thrust: { attack: 'attack_thrust', run: 'run_melee1h' },
  rifle: { attack: 'attack_rifle',   run: 'run_rifle' },
  onehand: { attack: 'attack_pistol', run: 'run' },
  throw: { attack: 'attack_throw',   run: 'run' },
};
const WEAPONS = {
  sword: ['剑', 'melee'], greatsword: ['大剑', 'heavy'], spear: ['长枪', 'thrust'],
  sniper: ['狙击枪', 'rifle'], flamer: ['喷火器', 'rifle'], freezer: ['冷冻枪', 'rifle'], laser: ['激光枪', 'rifle'],
  pistol: ['手枪', 'onehand'], smg: ['冲锋枪', 'onehand'], grenade: ['手雷', 'throw'], boomerang: ['回旋镖', 'throw'],
};
for (const [id, [name, g]] of Object.entries(WEAPONS)) WEAPONS[id] = { name, file: `assets/vox_${id}.glb`, ...GRIPS[g] };
// 12 名角色与各自的主武器（src/data/characters.ts）
const HEROES = [
  ['ron', '罗恩', 'greatsword'], ['gwen', '格温', 'spear'], ['kai', '凯', 'sword'], ['ironbull', '铁牛', 'greatsword'],
  ['vera', '薇拉', 'sniper'], ['jet', '杰特', 'smg'], ['ella', '艾拉', 'freezer'], ['bom', '博姆', 'grenade'],
  ['lian', '莉安', 'pistol'], ['shaman', '萨满', 'flamer'], ['nox', '诺克斯', 'boomerang'], ['sif', '西芙', 'laser'],
];
const STATES = { idle: 'Q', run: 'W', attack: 'E', hit: 'R', death: 'T' };
const N = HEROES.length, COLS = 6;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b1f1d);
scene.add(new THREE.HemisphereLight(0xdfe8e0, 0x30382f, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 2); sun.position.set(3, 6, 4); scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshLambertMaterial({ color: 0x3a4238 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
scene.add(new THREE.GridHelper(40, 40, 0x4c564a, 0x444c42));

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 100);
const VIEWS = { front: [[0, 2.2, 10], [0, 0.6, -0.8]], top: [[0, 13, 6], [0, 0, -0.8]],
  bfront: [[0, 3.6, 15], [0, 1.5, -0.8]], btop: [[0, 18, 9], [0, 0, -0.8]] };
let view = 'front';
// 右键拖动环绕、滚轮缩放、中键平移；左键留给以后点选
const orbit = new OrbitControls(camera, renderer.domElement);
orbit.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
// BOSS 是 2-2.6 倍大，另用一组拉远的机位
function setView(v) { view = v; const b = tab === 'bosses' ? 'b' : ''; camera.position.set(...VIEWS[b + v][0]); orbit.target.set(...VIEWS[b + v][1]); orbit.update(); }
let tab = 'heroes';
setView('front');

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
const load = (f) => new Promise((ok, err) => loader.load(f, ok, undefined, err));
const wIds = Object.keys(WEAPONS);
// 僵尸（zombies.html 同一张表）：skill = 专属动作；分裂小复用分裂的模型缩到 0.4
const ZOMBIES = [
  ['normal', '普通'], ['runner', '高速'], ['brute', '高防胖'], ['toxic', '毒液'], ['bomber', '爆炸', 'swell'],
  ['splitter', '分裂', 'split'], ['leaper', '跳跃', 'leap'], ['ward', '护盾', 'block'], ['spitter', '喷吐', 'spit'], ['spawnling', '分裂小'],
].map(([id, name, skill]) => ({ id, name, skill, file: id === 'spawnling' ? 'splitter' : id, scale: id === 'spawnling' ? 0.4 : 1 }));
const zFiles = [...new Set(ZOMBIES.map((z) => z.file))];
// BOSS（src/data/run.ts BOSSES）：skill = 专属动作，第二个是「专属 2」
const BOSSES = [
  ['corrupted', '腐化重装兵', []], ['vesse', '毒母·薇丝', ['summon', 'spit']], ['chaos', '尸潮之主·卡俄斯', ['smash', 'roar']],
].map(([id, name, skills]) => ({ id, name, skill: skills[0], skill2: skills[1], file: id, scale: 1 }));
// 场景物件（05 §4 / §5.2；src/data/scenes.ts 的 6 张图）：每张图的代表物件 + 通用件
const PNAME = { ruin: '残楼', shop: '临街铺面', car: '废弃轿车', fence: '铁栅栏', partition: '走廊隔断', barrel: '油桶', crate: '补给箱',
  ammo: '弹药箱', rubble: '碎石堆', tree: '阔叶树', palm: '棕榈', grass: '草丛', hay: '草垛', deadtree: '枯树', stump: '空心树桩',
  rock_moss: '苔石', cactus: '柱仙人掌', cactus_ball: '球仙人掌', mesa: '砂岩台地', pine: '雪松', snowpile: '雪堆', rock_ice: '冻岩',
  bunker: '碉堡', sandbag: '沙袋墙', wire: '铁丝网', woodwall: '木墙',
  buff_shield: '护盾', buff_speed: '加速', buff_damage: '增伤', buff_heal: '治疗', buff_cooldown: '冷却' };
const PSCENES = {
  city: ['城市废墟', 0x5a5a56, ['ruin', 'shop', 'car', 'partition', 'fence', 'barrel', 'rubble']],
  jungle: ['原始丛林', 0x3c5a2e, ['tree', 'palm', 'grass', 'hay']],
  swamp: ['沼泽疫地', 0x3e4636, ['deadtree', 'stump', 'rock_moss']],
  desert: ['荒漠废土', 0xb89a6a, ['mesa', 'cactus', 'cactus_ball', 'hay', 'barrel']],
  snow: ['雪原冻土', 0xc8d4dc, ['pine', 'snowpile', 'rock_ice', 'crate']],
  military: ['军事禁区', 0x5a5e4a, ['bunker', 'sandbag', 'wire', 'woodwall', 'crate', 'ammo', 'barrel']],
  shared: ['通用 · 增益', 0x3a4238, ['buff_shield', 'buff_speed', 'buff_damage', 'buff_heal', 'buff_cooldown', 'crate', 'barrel', 'rubble']],
};
const pIds = Object.keys(PNAME);
const [chars, wpns, zgl, bgl, pgl] = await Promise.all([
  Promise.all(HEROES.map(([id]) => load(`assets/vox_${id}.glb`))),
  Promise.all(wIds.map((id) => load(WEAPONS[id].file))),
  Promise.all(zFiles.map((f) => load(`assets/vox_z_${f}.glb`))),
  Promise.all(BOSSES.map((b) => load(`assets/vox_b_${b.file}.glb`))),
  Promise.all(pIds.map((id) => load(`assets/prop_${id}.glb`))),
]);
wIds.forEach((id, i) => (WEAPONS[id].scene = wpns[i].scene));
// Blender 导出的动作名带 "_Armature" 后缀，按前缀认
const clipOf = (anims, name) => anims.find((a) => a.name === name || a.name.startsWith(name + '_'));
// 持械跑：腿用 run，匹配 bones 的骨骼钉在持握姿态的第一帧
// 端枪 = 胸以上钉在抵肩瞄准；持刀 = 只钉右臂（刀尖朝前上），左臂照常摆
function overlay(anims, name, pose, bones) {
  const run = clipOf(anims, 'run'), hold = clipOf(anims, pose);
  const on = (t) => bones.test(t.name.split('.')[0]);
  const pinned = hold.tracks.filter(on).map((t) => {
    const n = t.getValueSize();
    return new t.constructor(t.name, [0], Array.from(t.values.slice(0, n)));
  });
  anims.push(new THREE.AnimationClip(name, run.duration, [...run.tracks.filter((t) => !on(t)), ...pinned]));
}

// 两排六人；每人一份自己的骨架和动作（体形不同，关节位置 12 人共用）
const units = HEROES.map(([id, name, weaponId], i) => {
  const g = chars[i];
  overlay(g.animations, 'run_rifle', 'attack_rifle', /mixamorig(Spine1|Spine2|Neck|Head|Left|Right)(?!.*(UpLeg|Leg|Foot|Toe))/);
  overlay(g.animations, 'run_melee1h', 'hold_melee1h', /mixamorigRight(Arm|ForeArm|Hand$)/);
  const root = g.scene;
  root.position.set((i % COLS - (COLS - 1) / 2) * 1.4, 0, -Math.floor(i / COLS) * 1.8);
  scene.add(root);
  const socket = root.getObjectByName('socket_hand_r');
  const mixer = new THREE.AnimationMixer(root);
  const u = { id, name, root, socket, mixer, anims: g.animations, home: weaponId, weapon: null, weaponId: null, state: null, action: null };
  mixer.addEventListener('finished', (e) => { if (e.action.getClip().name === 'hit') play(u, 'idle'); });
  return u;
});

// 唯一的挂点变换：武器 +Z（枪口）→ 骨骼 +Y，武器 +Y → 骨骼 -Z。所有武器共用，不逐把调
const GRIP = new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0));
function equip(u, id) {
  if (u.weapon) u.socket.remove(u.weapon);
  u.weapon = WEAPONS[id].scene.clone();
  u.weapon.quaternion.copy(GRIP);
  // 骨架导出时带了缩放，抵掉它让武器保持米制尺寸——这是整条骨架的常量，不是逐把偏移
  u.root.updateMatrixWorld(true);
  const s = new THREE.Vector3(); u.socket.getWorldScale(s);
  u.weapon.scale.setScalar(1 / s.x);
  u.socket.add(u.weapon);
  u.weaponId = id;
  if (u.state === 'attack' || u.state === 'run') play(u, u.state, true);
}

function play(u, state, force) {
  if (u.state === state && !force) return;
  const name = state === 'attack' || state === 'run' ? WEAPONS[u.weaponId][state] : state;
  const a = u.mixer.clipAction(clipOf(u.anims, name));
  const once = state === 'hit' || state === 'death';
  a.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = state === 'death';
  if (u.action && u.action !== a) a.crossFadeFrom(u.action, 0.15, false);
  a.play();
  u.action = a; u.state = state;
}

// ── 僵尸阵列：一排 10 只，材质名 _glow 不受光、_glass 半透明（同 zombies.html）──
const ZSRC = Object.fromEntries(zFiles.map((f, i) => [f, zgl[i]]));
const BSRC = Object.fromEntries(BOSSES.map((b, i) => [b.file, bgl[i]]));
const glow = new THREE.MeshBasicMaterial({ vertexColors: true });
for (const g of [...zgl, ...bgl, ...pgl]) g.scene.traverse((o) => {
  if (!o.isMesh) return;
  if (o.material.name.endsWith('_glow')) o.material = glow;
  else if (o.material.name.endsWith('_glass')) Object.assign(o.material, { transparent: true, opacity: 0.42, depthWrite: false });
});
// 一排站开（两排会互相挡）：僵尸间距 1.2 m，BOSS 间距 5 m
const mkUnits = (list, src, gap) => list.map((z, i) => {
  const root = SkeletonUtils.clone(src[z.file].scene);
  root.scale.setScalar(z.scale); root.visible = false;
  root.position.set((i - (list.length - 1) / 2) * gap, 0, -0.8);
  scene.add(root);
  const t = document.createElement('div'); t.className = 'tag'; t.textContent = z.name; tags.append(t);
  const u = { z, root, tag: t, mixer: new THREE.AnimationMixer(root), anims: src[z.file].animations, state: null, action: null };
  u.mixer.addEventListener('finished', () => { if (u.state === 'hit') zplay(u, 'idle'); });
  return u;
});
const zunits = mkUnits(ZOMBIES, ZSRC, 1.2), bunits = mkUnits(BOSSES, BSRC, 5);
const ZSTATES = { idle: ['待机', 'Q'], walk: ['移动', 'W'], attack: ['攻击', 'E'], skill: ['专属', 'S'], skill2: ['专属 2', 'D'], hit: ['受击', 'R'], death: ['死亡', 'T'] };
function zplay(u, state) {
  // 死亡三选一：后仰打飞 / 跪倒扑脸 / 打转侧倒
  const name = state === 'skill' ? u.z.skill || 'attack' : state === 'skill2' ? u.z.skill2 || u.z.skill || 'attack' : state === 'death' ? ['death', 'death2', 'death3'][Math.floor(Math.random() * 3)] : state;
  const a = u.mixer.clipAction(clipOf(u.anims, name));
  const once = ['hit', 'death', 'skill', 'skill2'].includes(state) && name !== 'block';
  a.reset().setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity);
  a.clampWhenFinished = once && state !== 'hit';
  if (u.action && u.action !== a) a.crossFadeFrom(u.action, 0.15, false);
  a.play(); u.action = a; u.state = state;
}
[...zunits, ...bunits].forEach((u) => zplay(u, 'idle'));
// 物件：每张图一组，从左到右按包围盒宽度排开、间隔 0.8 m；脚下一块该图的地色
const PSRC = Object.fromEntries(pIds.map((id, i) => [id, pgl[i].scene]));
const pgroups = Object.fromEntries(Object.entries(PSCENES).map(([sid, [name, col, ids]]) => {
  const g = new THREE.Group(); g.visible = false; scene.add(g);
  const sz = ids.map((id) => new THREE.Box3().setFromObject(PSRC[id]).getSize(new THREE.Vector3()));
  const W = sz.reduce((a, v) => a + v.x, 0) + 0.8 * (ids.length - 1);
  let x = -W / 2;
  const items = ids.map((id, i) => {
    const o = PSRC[id].clone(); o.position.x = x + sz[i].x / 2; x += sz[i].x + 0.8; g.add(o);
    const t = document.createElement('div'); t.className = 'tag'; t.textContent = PNAME[id]; t.hidden = true; tags.append(t);
    return { id, o, tag: t };
  });
  const pad = new THREE.Mesh(new THREE.PlaneGeometry(W + 3, 8), new THREE.MeshLambertMaterial({ color: col }));
  pad.rotation.x = -Math.PI / 2; pad.position.y = 0.005; g.add(pad);
  const H = Math.max(...sz.map((v) => v.y));
  return [sid, { g, items, W, H }];
}));
let pscene = 'city';

const btn = (parent, label, on) => { const b = document.createElement('button'); b.innerHTML = label; b.onclick = on; parent.append(b); return b; };
const wBtns = {}, sBtns = {};
wBtns.own = btn(weapons, '各自武器 <kbd>0</kbd>', () => setWeapon('own'));
for (const [id, w] of Object.entries(WEAPONS)) wBtns[id] = btn(weapons, w.name, () => setWeapon(id));
for (const [s, k] of Object.entries(STATES)) sBtns[s] = btn(states, `${s} <kbd>${k}</kbd>`, () => setState(s));
const zBtns = {}, tBtns = {};
for (const [s, [n, k]] of Object.entries(ZSTATES)) zBtns[s] = btn(zstates, `${n} <kbd>${k}</kbd>`, () => setZState(s));
const monsters = () => (tab === 'bosses' ? bunits : zunits);
// 物件机位：按这组的总宽 / 最高件拉远，斜前方俯看
function propView() {
  const { W, H } = pgroups[pscene], d = Math.max(W * 0.95, H * 2.2, 5);
  if (view === 'top') camera.position.set(0, d * 1.2, d * 0.35); else camera.position.set(0, d * 0.42 + H * 0.3, d);
  orbit.target.set(0, H * 0.3, 0); orbit.update();
}
const psBtns = {};
function setPScene(s) {
  pscene = s;
  for (const [k, p] of Object.entries(pgroups)) { p.g.visible = tab === 'props' && k === s; p.items.forEach((it) => (it.tag.hidden = !p.g.visible)); }
  mark(psBtns, s); if (tab === 'props') propView();
}
for (const [sid, [name]] of Object.entries(PSCENES)) psBtns[sid] = btn(pscenes, name, () => setPScene(sid));
function setZState(s) { monsters().forEach((u, i) => setTimeout(() => zplay(u, s), i * 60)); mark(zBtns, s); }
// 页签：角色 / 僵尸 / BOSS，同一个场景只换谁可见；僵尸与 BOSS 共用一排动作按钮
function setTab(t) {
  tab = t;
  units.forEach((u) => (u.root.visible = t === 'heroes'));
  zunits.forEach((u) => (u.root.visible = t === 'zombies'));
  bunits.forEach((u) => (u.root.visible = t === 'bosses'));
  weapons.hidden = states.hidden = t !== 'heroes'; zstates.hidden = t === 'heroes' || t === 'props'; tags.hidden = t === 'heroes';
  pscenes.hidden = t !== 'props'; ground.visible = t !== 'props';
  zBtns.skill2.hidden = t !== 'bosses';
  [...zunits, ...bunits].forEach((u) => (u.tag.hidden = !monsters().includes(u)));
  setPScene(pscene);
  if (t !== 'props') setView(view);
  for (const [k, b] of Object.entries(tBtns)) b.setAttribute('aria-selected', k === t), b.setAttribute('aria-pressed', k === t);
}
tBtns.heroes = btn(tabs, '角色 <kbd>1</kbd>', () => setTab('heroes'));
tBtns.zombies = btn(tabs, '僵尸 <kbd>2</kbd>', () => setTab('zombies'));
tBtns.bosses = btn(tabs, 'BOSS <kbd>3</kbd>', () => setTab('bosses'));
tBtns.props = btn(tabs, '场景物件 <kbd>4</kbd>', () => setTab('props'));
for (const b of Object.values(tBtns)) b.setAttribute('role', 'tab');
function mark(map, cur) { for (const [k, b] of Object.entries(map)) b.setAttribute('aria-pressed', k === cur); }
// 'own' = 每人拿自己的主武器；其余 = 全员换同一把（验"换武器只换挂点 + 动作组"）
function setWeapon(id) { units.forEach((u) => equip(u, id === 'own' ? u.home : id)); mark(wBtns, id); }
function setState(s) { units.forEach((u, i) => setTimeout(() => play(u, s), i * 90)); mark(sBtns, s); }
cam.onclick = () => { view = view === 'front' ? 'top' : 'front'; tab === 'props' ? propView() : setView(view); };
addEventListener('keydown', (e) => {
  const k = e.key.toUpperCase();
  if (k === '1') setTab('heroes');
  if (k === '2') setTab('zombies');
  if (k === '3') setTab('bosses');
  if (k === '4') setTab('props');
  if (tab === 'props') {}
  else if (tab !== 'heroes') { for (const [s, [, key]] of Object.entries(ZSTATES)) if (key === k) setZState(s); }
  else {
    if (k === '0') setWeapon('own');
    for (const [s, key] of Object.entries(STATES)) if (key === k) setState(s);
  }
  if (k === 'C') cam.click();
});
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

setWeapon('own');
units.forEach((u) => play(u, 'idle')); mark(sBtns, 'idle'); mark(zBtns, 'idle'); setTab('heroes');

// GPU 帧时间：EXT_disjoint_timer_query_webgl2，拿不到就只报 FPS
const gl = renderer.getContext();
const tq = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const pending = [], gpu = [];
let frames = 0, t0 = performance.now(), fps = 0;
const stats = (window.__m0 = { gpuMs: null, fps: 0, tris: 0, units, zunits, bunits, pgroups, setPScene, setTab, setZState, setWeapon, setState, setView, WEAPONS, camera });
const tp = new THREE.Vector3();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  units.forEach((u) => {
    u.mixer.update(dt);
    // 投掷：出手后手里没东西，收回手时再"摸出"下一颗（秒数对 poses.py 的 attack_throw）
    if (u.weapon) u.weapon.visible = !(u.state === 'attack' && WEAPONS[u.weaponId].attack === 'attack_throw' && u.action.time > 0.33 && u.action.time < 0.72);
  });
  // 增益：自转 + 上下浮；物件名牌钉在包围盒顶上
  if (tab === 'props') for (const it of pgroups[pscene].items) {
    if (it.id.startsWith('buff_')) { it.o.rotation.y += dt * 1.5; it.o.position.y = 0.08 + Math.sin(clock.elapsedTime * 2.5) * 0.05; }
    tp.setFromMatrixPosition(it.o.matrixWorld).project(camera);
    it.tag.style.left = (tp.x + 1) / 2 * innerWidth + 'px'; it.tag.style.top = (1 - tp.y) / 2 * innerHeight + 8 + 'px';
  }
  if (tab !== 'heroes' && tab !== 'props') for (const u of monsters()) {
    u.mixer.update(dt);
    tp.setFromMatrixPosition(u.root.matrixWorld).project(camera);
    u.tag.style.left = (tp.x + 1) / 2 * innerWidth + 'px'; u.tag.style.top = (1 - tp.y) / 2 * innerHeight + 8 + 'px';
  }
  let q;
  if (tq) { q = gl.createQuery(); gl.beginQuery(tq.TIME_ELAPSED_EXT, q); }
  renderer.render(scene, camera);
  if (tq) { gl.endQuery(tq.TIME_ELAPSED_EXT); pending.push(q); }
  while (pending.length && gl.getQueryParameter(pending[0], gl.QUERY_RESULT_AVAILABLE)) {
    const p = pending.shift();
    if (!gl.getParameter(tq.GPU_DISJOINT_EXT)) gpu.push(gl.getQueryParameter(p, gl.QUERY_RESULT) / 1e6);
    gl.deleteQuery(p);
    if (gpu.length > 120) gpu.shift();
  }
  frames++;
  const now = performance.now();
  if (now - t0 > 500) {
    fps = frames * 1000 / (now - t0); frames = 0; t0 = now;
    stats.fps = fps; stats.tris = renderer.info.render.triangles;
    stats.gpuMs = gpu.length ? gpu.reduce((a, b) => a + b, 0) / gpu.length : null;
    stat.textContent = `${tab === 'heroes' ? N : tab === 'props' ? pgroups[pscene].items.length : monsters().length} 实例 · ${stats.tris} 三角面 · ${fps.toFixed(0)} FPS · GPU ${stats.gpuMs == null ? '不可测' : stats.gpuMs.toFixed(2) + ' ms'}`;
  }
});
</script>
